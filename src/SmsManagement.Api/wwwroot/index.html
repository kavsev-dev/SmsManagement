<!doctype html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMS Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2z'/%3E%3C/svg%3E">

  <!-- Every page load starts in dark mode (the "dark" class is on <html>); the toggle switches only the current
       visit and is not remembered. -->

  <!-- Tailwind CSS (browser build, pinned version + Subresource Integrity). -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5/dist/index.global.js"
          integrity="sha384-t+qLIxS5zM/KF99/doWY+dxTsavdvgayaZt8A9ntLsUjEkiXzYl5M3Ij8zVFPL9j"
          crossorigin="anonymous"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
</head>

<body class="h-full bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">
  <div class="min-h-full">

    <!-- Header -->
    <header class="border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-900/80">
      <div class="mx-auto flex max-w-screen-2xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
        <div class="flex min-w-0 items-center gap-3">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-semibold leading-tight">SMS Management</h1>
            <p class="hidden text-sm text-slate-500 sm:block dark:text-slate-400">Send and track employee SMS messages</p>
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <a href="/scalar" target="_blank" rel="noopener"
             class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
            API docs
          </a>
          <button id="theme-toggle" type="button" title="Toggle dark mode" aria-label="Toggle dark mode"
                  class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
            <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
            <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="mx-auto grid max-w-screen-2xl gap-6 px-4 py-6 sm:px-6 lg:grid-cols-[minmax(20rem,24rem)_minmax(0,1fr)]">

      <!-- Send form -->
      <section class="h-fit min-w-0 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900" aria-labelledby="send-title">
        <h2 id="send-title" class="text-base font-semibold">Send a message</h2>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Messages are stored, dispatched and tracked.</p>

        <form id="send-form" class="mt-5 space-y-5" novalidate>
          <div>
            <label for="to" class="block text-sm font-medium">Recipient phone</label>
            <input id="to" name="to" type="tel" inputmode="tel" autocomplete="off" required
                   placeholder="0501234567 or +972501234567"
                   aria-describedby="to-hint to-error"
                   class="field mt-1.5 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-950">
            <p id="to-hint" class="mt-1 text-xs text-slate-500 dark:text-slate-400" aria-live="polite">Digits only, with an optional + at the start.</p>
            <p id="to-error" class="mt-1 hidden text-xs font-medium text-red-600 dark:text-red-400"></p>
          </div>

          <div>
            <label for="body" class="block text-sm font-medium">Message</label>
            <textarea id="body" name="body" rows="5" maxlength="160" dir="auto" required
                      placeholder="Hello, your schedule has been updated."
                      aria-describedby="counter body-error"
                      class="field mt-1.5 block w-full resize-y rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-950"></textarea>
            <div class="mt-1 flex items-start justify-between gap-3">
              <p id="body-error" class="hidden text-xs font-medium text-red-600 dark:text-red-400"></p>
              <p id="counter" class="ml-auto shrink-0 text-xs tabular-nums text-slate-500 dark:text-slate-400" aria-live="polite">160 / 160 characters remaining</p>
            </div>
          </div>

          <div>
            <label for="provider" class="block text-sm font-medium">SMS provider</label>
            <select id="provider" name="provider" aria-describedby="provider-error"
                    class="field mt-1.5 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-950">
              <option value="Mock">Mock Provider</option>
              <option value="Secondary">Secondary Provider</option>
            </select>
            <p id="provider-error" class="mt-1 hidden text-xs font-medium text-red-600 dark:text-red-400"></p>
          </div>

          <button id="submit" type="submit"
                  class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-not-allowed disabled:opacity-60">
            <svg id="spinner" class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"/>
            </svg>
            <span id="submit-label">Send message</span>
          </button>

          <div id="result" class="hidden rounded-lg border px-3 py-2.5 text-sm" role="status" aria-live="polite"></div>
        </form>
      </section>

      <!-- Messages -->
      <section class="min-w-0 rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900" aria-labelledby="messages-title">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-6 py-4 dark:border-slate-800">
          <div>
            <h2 id="messages-title" class="text-base font-semibold">Messages <span id="count" class="ml-1 text-sm font-normal text-slate-500 dark:text-slate-400"></span></h2>
            <p id="last-updated" class="text-xs text-slate-500 dark:text-slate-400">Not loaded yet</p>
          </div>
          <div class="flex items-center gap-3">
            <label class="flex cursor-pointer items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
              <button id="auto-refresh" type="button" role="switch" aria-checked="true" aria-label="Auto-refresh every 5 seconds"
                      class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full bg-slate-300 transition-colors aria-checked:bg-indigo-600 dark:bg-slate-700">
                <span class="inline-block h-5 w-5 translate-x-0.5 rounded-full bg-white shadow transition-transform"></span>
              </button>
              Auto-refresh
            </label>
          </div>
        </div>

        <!-- Status filter -->
        <div class="flex flex-wrap gap-2 px-6 pt-4" role="group" aria-label="Filter by status">
          <button type="button" data-status="" class="filter-btn">All</button>
          <button type="button" data-status="Sent" class="filter-btn">Sent</button>
          <button type="button" data-status="Failed" class="filter-btn">Failed</button>
          <button type="button" data-status="Pending" class="filter-btn">Pending</button>
        </div>

        <div id="load-error" class="mx-6 mt-4 hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-900/60 dark:bg-red-950/40 dark:text-red-300" role="alert"></div>

        <div class="overflow-x-auto px-2 pb-2 pt-3">
          <table class="min-w-full text-left text-sm">
            <thead class="whitespace-nowrap text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">
              <tr>
                <th scope="col" class="px-4 py-2 font-medium">Message ID</th>
                <th scope="col" class="px-4 py-2 font-medium">Recipient</th>
                <th scope="col" class="px-4 py-2 font-medium">Employee</th>
                <th scope="col" class="px-4 py-2 font-medium">Body</th>
                <th scope="col" class="px-4 py-2 font-medium">Provider</th>
                <th scope="col" class="px-4 py-2 font-medium">Status</th>
                <th scope="col" class="px-4 py-2 font-medium">Timestamp</th>
              </tr>
            </thead>
            <tbody id="rows" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <style type="text/tailwindcss">
    .filter-btn {
      @apply rounded-full border border-slate-300 px-3.5 py-1 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800;
    }
    .filter-btn[aria-pressed="true"] {
      @apply border-indigo-600 bg-indigo-600 text-white hover:bg-indigo-600 dark:border-indigo-500 dark:bg-indigo-500 dark:text-white;
    }
    .field[aria-invalid="true"] {
      @apply border-red-500 focus:border-red-500 focus:ring-red-500/30;
    }
    #auto-refresh[aria-checked="true"] > span {
      @apply translate-x-5;
    }
  </style>

  <script>
    'use strict';

    const MAX_BODY_LENGTH = 160;
    const AUTO_REFRESH_MS = 5000;
    // While a send is in flight, auto-refresh polls faster, so the stored Pending message is visible before the
    // provider answers and the status turns Sent or Failed.
    const SENDING_REFRESH_MS = 500;

    const $ = (id) => document.getElementById(id);
    const form = $('send-form');
    const fields = { to: $('to'), body: $('body'), provider: $('provider') };
    const state = { status: '', loading: false, requestSeq: 0, timer: null, hintTimer: null, autoRefresh: true };

    // ---------- Theme ----------
    // Starts dark on every load; the toggle applies to the current visit only.
    $('theme-toggle').addEventListener('click', () => document.documentElement.classList.toggle('dark'));

    // ---------- Validation (mirrors the server rules) ----------
    const ISRAELI_NATIONAL = /^0(?:[57]\d{8}|[2-489]\d{7})$/;
    const E164 = /^\+[1-9]\d{6,14}$/;

    function isValidPhone(value) {
      if (!value || !value.trim() || value.length > 32) return false;
      const compact = value.trim().replace(/[\s-]/g, '');
      if (ISRAELI_NATIONAL.test(compact)) return true;
      if (compact.startsWith('+972')) return ISRAELI_NATIONAL.test('0' + compact.slice(4));
      return E164.test(compact);
    }

    function validate() {
      const errors = {};
      const to = fields.to.value;
      const body = fields.body.value;

      if (!to.trim()) errors.to = 'Recipient phone number is required.';
      else if (!isValidPhone(to)) errors.to = 'Enter a valid E.164 (+972501234567) or Israeli (0501234567) number.';

      if (!body.trim()) errors.body = 'Message text is required.';
      else if (body.length > MAX_BODY_LENGTH) errors.body = `Message must not exceed ${MAX_BODY_LENGTH} characters.`;

      if (!fields.provider.value) errors.provider = 'Select a provider.';
      return errors;
    }

    function showFieldErrors(errors) {
      for (const [name, input] of Object.entries(fields)) {
        const message = errors[name];
        const errorEl = $(`${name}-error`);
        errorEl.textContent = message ?? '';
        errorEl.classList.toggle('hidden', !message);
        input.setAttribute('aria-invalid', message ? 'true' : 'false');
      }
    }

    // ---------- Character countdown (fixed 160-character limit) ----------
    function updateCounter() {
      const remaining = MAX_BODY_LENGTH - fields.body.value.length;
      const counter = $('counter');
      counter.textContent = `${remaining} / ${MAX_BODY_LENGTH} characters remaining`;
      counter.classList.toggle('text-amber-600', remaining <= 20 && remaining > 0);
      counter.classList.toggle('dark:text-amber-400', remaining <= 20 && remaining > 0);
      counter.classList.toggle('text-red-600', remaining <= 0);
      counter.classList.toggle('dark:text-red-400', remaining <= 0);
    }
    fields.body.addEventListener('input', updateCounter);

    // ---------- Phone input: live character and length checks ----------
    // While typing, only digits and one leading "+" are kept, up to the longest length of the format being typed.
    // Separators in pasted numbers (050-123-4567) are dropped. The full format check runs on submit.
    const PHONE_HINT = $('to-hint').textContent;
    const HINT_WARNING_CLASSES = ['text-amber-600', 'dark:text-amber-400'];

    /** Longest accepted length for the format being typed. */
    function phoneMaxLength(value) {
      if (value.startsWith('+972')) return 13; // +972 + 9 digits (e.g. +972501234567)
      if (value.startsWith('+')) return 16;    // E.164: + and up to 15 digits
      return 10;                               // Israeli national: 0 + up to 9 digits (e.g. 0501234567)
    }

    /**
     * Keeps digits and a leading "+", then cuts to the format's maximum length.
     * Reports whether a character other than a separator (space, hyphen) was removed, and whether it was cut.
     */
    function sanitizePhone(raw) {
      let clean = '';
      let rejected = false;
      for (const ch of raw) {
        if (ch >= '0' && ch <= '9') clean += ch;
        else if (ch === '+' && clean === '') clean += ch;
        else if (ch !== ' ' && ch !== '-') rejected = true;
      }
      const max = phoneMaxLength(clean);
      return { value: clean.slice(0, max), rejected, truncated: clean.length > max, max };
    }

    function flashPhoneHint(text) {
      const hint = $('to-hint');
      hint.textContent = text;
      hint.classList.add(...HINT_WARNING_CLASSES);
      clearTimeout(state.hintTimer);
      state.hintTimer = setTimeout(() => {
        hint.textContent = PHONE_HINT;
        hint.classList.remove(...HINT_WARNING_CLASSES);
      }, 2500);
    }

    fields.to.addEventListener('input', () => {
      const input = fields.to;
      const raw = input.value;
      const result = sanitizePhone(raw);
      if (result.value === raw) return;

      // Keep the caret where the user was typing, not at the end.
      const beforeCaret = sanitizePhone(raw.slice(0, input.selectionStart ?? raw.length)).value.length;
      const caret = Math.min(beforeCaret, result.value.length);
      input.value = result.value;
      input.setSelectionRange(caret, caret);

      if (result.rejected) flashPhoneHint('Only digits are allowed, with an optional + at the start.');
      else if (result.truncated) flashPhoneHint(`A phone number in this format has at most ${result.max} characters.`);
    });

    for (const input of Object.values(fields)) {
      input.addEventListener('input', () => {
        if (input.getAttribute('aria-invalid') === 'true') showFieldErrors(validate());
      });
    }

    // ---------- Send ----------
    function setSubmitting(submitting) {
      $('submit').disabled = submitting;
      $('spinner').classList.toggle('hidden', !submitting);
      $('submit-label').textContent = submitting ? 'Sending…' : 'Send message';
    }

    function showResult(kind, text) {
      const styles = {
        success: 'border-green-200 bg-green-50 text-green-800 dark:border-green-900/60 dark:bg-green-950/40 dark:text-green-300',
        failure: 'border-red-200 bg-red-50 text-red-800 dark:border-red-900/60 dark:bg-red-950/40 dark:text-red-300',
      };
      const el = $('result');
      el.className = `rounded-lg border px-3 py-2.5 text-sm ${styles[kind]}`;
      el.textContent = text;
    }

    function hideResult() {
      $('result').className = 'hidden';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideResult();

      const errors = validate();
      showFieldErrors(errors);
      if (Object.keys(errors).length > 0) {
        fields[Object.keys(errors)[0]].focus();
        return;
      }

      setSubmitting(true);
      const sendingPoll = state.autoRefresh
        ? setInterval(() => { if (state.autoRefresh && !state.loading) loadMessages(); }, SENDING_REFRESH_MS)
        : null;
      try {
        const response = await fetch('/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            to: fields.to.value.trim(),
            body: fields.body.value,
            provider: fields.provider.value,
          }),
        });
        const payload = await response.json().catch(() => null);
        clearInterval(sendingPoll);

        if (response.status === 201 && payload) {
          if (payload.status === 'Sent') {
            showResult('success', `Message sent via ${payload.providerName}. ID ${payload.id}`);
            // Clear the form for the next message. After a failure the inputs are kept, so it can be retried.
            fields.to.value = '';
            fields.body.value = '';
            updateCounter();
          } else {
            showResult('failure', `Delivery failed via ${payload.providerName}: ${payload.errorMessage ?? 'unknown error'}`);
          }
          // With auto-refresh off the table changes only on a filter change, or when auto-refresh is turned on.
          if (state.autoRefresh) await loadMessages();
        } else if (response.status === 400 && payload?.errors) {
          // RFC 7807 validation problem: map server field errors onto the form.
          const serverErrors = {};
          for (const [key, messages] of Object.entries(payload.errors)) {
            const name = key.replace(/^\$\.?/, '').toLowerCase();
            serverErrors[fields[name] ? name : 'body'] = messages.join(' ');
          }
          showFieldErrors(serverErrors);
          showResult('failure', payload.title ?? 'The request is invalid.');
        } else {
          showResult('failure', payload?.title ?? `Unexpected response (HTTP ${response.status}).`);
        }
      } catch {
        showResult('failure', 'The API is unreachable. Check that the server is running.');
      } finally {
        clearInterval(sendingPoll);
        setSubmitting(false);
      }
    });

    // ---------- Messages table ----------
    const dateFormat = new Intl.DateTimeFormat(undefined, { dateStyle: 'short', timeStyle: 'medium' });

    const BADGES = {
      Sent: 'bg-green-100 text-green-800 ring-green-600/20 dark:bg-green-900/40 dark:text-green-300',
      Failed: 'bg-red-100 text-red-800 ring-red-600/20 dark:bg-red-900/40 dark:text-red-300',
      Pending: 'bg-yellow-100 text-yellow-800 ring-yellow-600/20 dark:bg-yellow-900/40 dark:text-yellow-300',
    };

    /** Creates an element; children are strings (rendered as text, never HTML) or nodes. */
    function el(tag, props = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (value === undefined || value === null) continue;
        if (key === 'className') node.className = value;
        else if (key === 'text') node.textContent = value;
        else node.setAttribute(key, value);
      }
      for (const child of children) node.append(child);
      return node;
    }

    function messageRow(m) {
      const idCell = el('td', { className: 'px-4 py-3' },
        el('button', {
          type: 'button',
          title: `${m.id}\nClick to copy`,
          className: 'font-mono text-xs text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400',
          'data-copy': m.id,
          text: `${m.id.slice(0, 8)}…`,
        }));

      const statusCell = el('td', { className: 'px-4 py-3' },
        el('span', {
          className: `inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${BADGES[m.status] ?? BADGES.Pending}`,
          title: m.errorMessage ?? undefined,
          text: m.status,
        }));
      if (m.status === 'Failed' && m.errorMessage) {
        statusCell.append(el('p', {
          className: 'mt-1 max-w-[11rem] truncate text-xs text-red-600 dark:text-red-400',
          title: m.errorMessage,
          text: m.errorMessage,
        }));
      }

      const created = new Date(m.createdAt);
      const timeTitle = `Created ${m.createdAt}` + (m.sentAt ? `\nSent ${m.sentAt}` : '');

      return el('tr', { className: 'align-top hover:bg-slate-50 dark:hover:bg-slate-800/50' },
        idCell,
        el('td', { className: 'whitespace-nowrap px-4 py-3 font-medium tabular-nums', text: m.to }),
        // Matched on the fly by phone number; empty when the number belongs to no employee.
        el('td', { className: 'max-w-[12rem] px-4 py-3', dir: 'auto', text: (m.employeeNames ?? []).join(', ') }),
        el('td', { className: 'max-w-[16rem] px-4 py-3' },
          el('p', { className: 'truncate', dir: 'auto', title: m.body, text: m.body })),
        el('td', { className: 'whitespace-nowrap px-4 py-3', text: m.providerName }),
        statusCell,
        el('td', { className: 'whitespace-nowrap px-4 py-3 text-slate-500 dark:text-slate-400', title: timeTitle, text: dateFormat.format(created) }),
      );
    }

    function renderRows(messages) {
      const tbody = $('rows');
      if (messages.length === 0) {
        const label = state.status ? `No ${state.status.toLowerCase()} messages.` : 'No messages yet. Send one to get started.';
        tbody.replaceChildren(el('tr', {},
          el('td', { colspan: '7', className: 'px-4 py-10 text-center text-slate-500 dark:text-slate-400', text: label })));
      } else {
        tbody.replaceChildren(...messages.map(messageRow));
      }
      $('count').textContent = `(${messages.length})`;
    }

    $('rows').addEventListener('click', async (event) => {
      const button = event.target.closest('[data-copy]');
      if (!button) return;
      try {
        await navigator.clipboard.writeText(button.dataset.copy);
        const original = button.textContent;
        button.textContent = 'Copied';
        setTimeout(() => { button.textContent = original; }, 1200);
      } catch { /* clipboard unavailable (e.g. insecure context): ignore */ }
    });

    async function loadMessages() {
      // Sequence number: a slower, older response must never overwrite a newer one (e.g. after a filter change).
      const seq = ++state.requestSeq;
      state.loading = true;

      try {
        const query = state.status ? `?status=${encodeURIComponent(state.status)}` : '';
        const response = await fetch(`/messages${query}`, { headers: { 'Accept': 'application/json' } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const messages = await response.json();
        if (seq !== state.requestSeq) return;

        renderRows(messages);
        $('load-error').classList.add('hidden');
        $('last-updated').textContent = `Last updated ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        if (seq !== state.requestSeq) return;
        const banner = $('load-error');
        banner.textContent = `Could not load messages (${error.message}). Retrying automatically while auto-refresh is on.`;
        banner.classList.remove('hidden');
      } finally {
        if (seq === state.requestSeq) state.loading = false;
      }
    }

    // ---------- Filter ----------
    function setFilter(status) {
      state.status = status;
      for (const button of document.querySelectorAll('.filter-btn')) {
        button.setAttribute('aria-pressed', String(button.dataset.status === status));
      }
      loadMessages();
    }
    for (const button of document.querySelectorAll('.filter-btn')) {
      button.addEventListener('click', () => setFilter(button.dataset.status));
    }

    // ---------- Auto-refresh ----------
    // On: the table reloads every 5 seconds, and live while a message is being sent.
    // Off: the table never reloads by itself, only on a filter change; turning it back on reloads at once.
    // It is not remembered between visits: every page load starts with auto-refresh on.
    function setAutoRefresh(enabled) {
      state.autoRefresh = enabled;
      $('auto-refresh').setAttribute('aria-checked', String(enabled));
      clearInterval(state.timer);
      state.timer = enabled
        ? setInterval(() => { if (!document.hidden && !state.loading) loadMessages(); }, AUTO_REFRESH_MS)
        : null;
    }
    $('auto-refresh').addEventListener('click', () => {
      const enabled = !state.autoRefresh;
      setAutoRefresh(enabled);
      if (enabled) loadMessages(); // catch up right away instead of waiting for the first tick
    });

    // ---------- Start ----------
    updateCounter();
    setAutoRefresh(true);
    setFilter('');
  </script>
</body>
</html>
